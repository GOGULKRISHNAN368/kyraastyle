<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fcf7f2">
  <title>Your Cart | Kryaa Style</title>
  <link rel="stylesheet" href="shop.css"><link rel="stylesheet" href="shop-flow.css?v=6"><link rel="stylesheet" href="cart-page.css?v=1"><link rel="stylesheet" href="mobile-menu.css?v=1"><link rel="stylesheet" href="product-image-fit.css?v=1">
  <script src="shop-mobile-menu.js?v=1" defer></script><script src="shop-auth.js" defer></script><script src="shop-bag.js" defer></script><script src="shop-runtime.js?v=9" defer></script><script src="product-images.js?v=1" defer></script><script src="cart-page.js?v=1" defer></script>
</head>
<body>
  <header class="shop-header"><a class="shop-brand" href="index.html" aria-label="Kryaa Style home">KYRAA<span>STYLE</span></a><nav class="shop-primary-nav" aria-label="Main navigation"><a href="index.html">Continue shopping</a></nav><a class="shop-header__bag" href="#shop-bag" data-shop-bag-trigger aria-label="Shopping bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg><span class="shop-header__bag-count" data-shop-bag-count hidden>0</span></a></header>
  <main class="cart-page">
    <nav class="product-breadcrumbs" aria-label="Breadcrumb"><a href="../kyraastyle.com/index.html">Home</a><span>/</span><a href="index.html">Shop</a><span>/</span><strong>Your Cart</strong></nav>
    <h1>Your Cart</h1>
    <ol class="cart-progress" aria-label="Checkout progress"><li class="is-current"><span>1</span><small>Cart</small></li><i></i><li><span>2</span><small>Details</small></li><i></i><li><span>3</span><small>Payment</small></li></ol>
    <p class="cart-status" id="cart-status" role="status" hidden></p>
    <div class="cart-layout">
      <section class="cart-lines" id="cart-lines" aria-label="Cart items" aria-live="polite"></section>
      <aside class="cart-summary" aria-labelledby="cart-summary-title"><h2 id="cart-summary-title">Order Summary</h2>
        <dl><div><dt>Subtotal</dt><dd id="cart-subtotal">₹0</dd></div><div><dt>Shipping</dt><dd id="cart-shipping">Free</dd></div><div class="cart-summary-total"><dt>Total</dt><dd id="cart-total">₹0</dd></div></dl>
        <div class="cart-coupon-slot" id="cart-coupon-slot" hidden></div>
        <button class="cart-primary" id="cart-checkout" type="button" disabled>Proceed to checkout</button>
      </aside>
    </div>
    <div class="cart-mobile-bar" id="cart-mobile-bar" hidden><strong id="cart-mobile-total">₹0</strong><button class="cart-primary" id="cart-mobile-checkout" type="button" disabled>Proceed to checkout</button></div>
  </main>
  <div class="cart-undo" id="cart-undo" role="status" aria-live="polite" hidden><span id="cart-undo-message">Item removed</span><button id="cart-undo-button" type="button">Undo</button></div>
</body>
</html>
